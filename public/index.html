<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OncoLentes | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#0c2d59',
              brand: '#427fe2',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 font-sans text-slate-800">
    <main class="flex min-h-screen items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
      <section class="w-full max-w-[400px] rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
        <div class="flex justify-center">
          <img src="/gemini-svg.svg" alt="Logo OncoLentes" class="h-20 w-full max-w-[220px] object-contain" />
        </div>

        <div class="mt-6 text-center">
          <h1 class="text-2xl font-bold text-navy">Acesso ao painel</h1>
          <p class="mt-2 text-sm text-slate-600">Acesse o protótipo de pitch com segurança e agilidade.</p>
        </div>

        <form id="loginForm" class="mt-8 space-y-4" action="https://oncolentes-production.up.railway.app/dashboard.html" method="get">
          <div>
            <label for="usuario" class="mb-2 block text-sm font-semibold text-slate-700">Usuário</label>
            <input id="usuario" type="text" placeholder="seu.usuario" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
          </div>

          <div>
            <label for="senha" class="mb-2 block text-sm font-semibold text-slate-700">Senha</label>
            <input id="senha" type="password" placeholder="••••••••" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />
          </div>

          <button id="loginButton" type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-[#0c2d59] px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#427fe2]">
            Entrar
          </button>
        </form>

        <div class="mt-6 text-center text-sm">
          <a href="https://oncolentes-production.up.railway.app/dashboard.html" class="font-medium text-brand hover:text-[#2f6dd1]">Continuar para o dashboard</a>
        </div>
      </section>
    </main>

    <script>
      document.getElementById('loginForm')?.addEventListener('submit', function (event) {
        event.preventDefault();
        window.location.href = 'https://oncolentes-production.up.railway.app/dashboard.html';
      });
    </script>
  </body>
</html>
