<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Gradiente ultradetalhado da lente (glare metálico/reflexo diagonal de câmera) -->
    <linearGradient id="cameraLensGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#f5d6ff"/> <!-- Reflexo rosa/lilás suave do vidro -->
      <stop offset="25%" stop-color="#bc97f7"/> <!-- Transição roxa -->
      <stop offset="42%" stop-color="#4a6fd8"/> <!-- Azul metálico intermediário -->
      <stop offset="70%" stop-color="#0f2354"/> <!-- Profundidade azul escuro -->
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>

    <!-- Sombras internas para dar profundidade de lente fotográfica -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Configuração da fonte idêntica: arredondada, limpa e moderna -->
    <style>
      .oncolentes-text {
        font-family: 'Comfortaa', 'Quicksand', 'Nunito', 'Inter', 'Segoe UI', sans-serif;
        font-size: 68px;
        font-weight: 500;
        letter-spacing: -2px;
      }
      .navy-brand {
        fill: #0c2d59; /* Azul marinho idêntico ao "O" da lente e ao "nco" */
      }
      .blue-brand {
        fill: #427fe2; /* Azul cerúleo do "Lentes" */
      }
    </style>
  </defs>

  <!-- Grupo Geral do Logotipo -->
  <g id="Logo">
    
    <!-- O "O" QUE É A LENTE (Esquerda) -->
    <g transform="translate(15, 10)">
      <!-- 1. Anel Externo Azul Marinho (O corpo da letra O) -->
      <circle cx="60" cy="60" r="50" fill="none" stroke="#0c2d59" stroke-width="12.5"/>
      
      <!-- 2. Linha Fina de Brilho Branco Interno -->
      <circle cx="60" cy="60" r="41.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      
      <!-- 3. Corpo da Lente com o Gradiente Diagonal Roxo/Azul -->
      <circle cx="60" cy="60" r="39" fill="url(#cameraLensGradient)"/>
      
      <!-- 4. Efeito de profundidade 3D (sombra interna) -->
      <circle cx="60" cy="60" r="39" fill="url(#innerShadow)"/>
      
      <!-- 5. Íris/Abertura Escura Central -->
      <circle cx="60" cy="60" r="16" fill="#030511"/>
      
      <!-- 6. Reflexo de Luz Principal (Brilho às 11 horas) -->
      <circle cx="49" cy="49" r="5" fill="#ffffff" opacity="0.95"/>
      
      <!-- 7. Reflexo de Luz Secundário (Brilho oposto às 5 horas) -->
      <circle cx="70" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- RESTANTE DO TEXTO "ncoLentes" (Saindo diretamente da lente) -->
    <!-- Posicionado perfeitamente para simular a continuidade da palavra "OncoLentes" -->
    <text x="131" y="93" class="oncolentes-text">
      <tspan class="navy-brand">nco</tspan><tspan class="blue-brand">Lentes</tspan>
    </text>

  </g>
</svg>
